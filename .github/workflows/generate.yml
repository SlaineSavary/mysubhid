name: Build V2Ray Subscription

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate subscription
        run: python generate.py

      - name: Commit subscription
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add sub.txt
          git commit -m "update subscription" || echo "no changes"
          git push
name: Generate V2Ray Links

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:

jobs:
  generate-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests>=2.32.3 beautifulsoup4>=4.12.3

      - name: Run generate.py
        run: python generate.py --url https://github.com/SlaineSavary/mysubhid/blob/main/IR_NETLIFY_Configs_2026_05_13_15-38-59.txt

      - name: Check for file changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            echo "has_changes=false" >> $GITHUB_ENV
          else
            echo "Changes detected."
            echo "has_changes=true" >> $GITHUB_ENV
          fi

      - name: Commit and push updated links
        if: env.has_changes == 'true'
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "<>"
          git add links.txt
          git commit -m "Update links.txt"
          git push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
